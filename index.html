<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:monospace}
body{display:flex;align-items:center;justify-content:center}
#shell{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:6px;
background:#17325fdd;color:#fff;padding:8px 10px;font-size:clamp(10px,2.2vw,22px);font-weight:900;
text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden}
#hud .name{color:#6db64a}#hud .money{color:#ffd83d}
#status{position:absolute;z-index:22;top:52px;left:50%;transform:translateX(-50%);padding:7px 12px;
border-radius:10px;background:#06101bd9;color:#fff;font-weight:900;opacity:0;pointer-events:none}
#controls{position:absolute;z-index:30;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;
align-items:end;padding:0 14px;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:68px;height:68px;border-radius:50%;border:2px solid #ffffff44;background:#0d1624d9;color:#fff;
font-size:26px;font-weight:900;touch-action:none;user-select:none}
.ctrl:active{transform:scale(.94)}
#jump{width:82px;height:82px;background:#245a35e6}
#fire{width:82px;height:82px;background:#a6292fe6}
#startOverlay{position:absolute;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;
background:#02050abf;backdrop-filter:blur(4px)}
.card{width:min(430px,100%);padding:24px;text-align:center;border-radius:22px;background:#0e1b2eee;border:2px solid #ffffff30;color:#fff}
.card h1{margin:0 0 8px;font-size:clamp(30px,8vw,44px)}
.card p{font-family:Arial,sans-serif;color:#d9e1ea;line-height:1.4}
#play{width:100%;height:56px;border:0;border-radius:14px;background:#ffd83d;color:#171717;font-size:20px;font-weight:900}
@media (orientation:portrait){
  #hud{font-size:10px;padding:7px 6px}
  .ctrl{width:64px;height:64px}
  #jump,#fire{width:76px;height:76px}
}
</style>

const livesEl=document.getElementById('lives');
const moneyEl=document.getElementById('money');
const timeEl=document.getElementById('time');
const scoreEl=document.getElementById('score');
const overlay=document.getElementById('startOverlay');
const playBtn=document.getElementById('play');
const statusEl=document.getElementById('status');

const leftBtn=document.getElementById('left');
const rightBtn=document.getElementById('right');
const jumpBtn=document.getElementById('jump');
const fireBtn=document.getElementById('fire');

let W=0,H=0,DPR=1,last=performance.now();
let running=false,elapsed=0,timeLeft=300,score=0,money=0,lives=3;
let keys={left:false,right:false};
let shots=[],enemies=[];

const player={
 x:0,y:0,w:46,h:74,vx:0,vy:0,onGround:true,facing:1,cooldown:0,inv:0
};

function groundY(){ return H*0.86; }

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(320,window.innerWidth);
  H=Math.max(480,window.innerHeight);
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!running){
    player.x=W*0.28;
    player.y=groundY()-player.h;
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,100));
resize();

function syncHUD(){
  livesEl.textContent=String(lives).padStart(2,'0');
  moneyEl.textContent=String(money).padStart(2,'0');
  timeEl.textContent=String(Math.max(0,Math.ceil(timeLeft)));
  scoreEl.textContent=String(Math.floor(score)).padStart(6,'0').slice(-6);
}

function showStatus(text){
  statusEl.textContent=text;
  statusEl.style.opacity='1';
  clearTimeout(showStatus.t);
  showStatus.t=setTimeout(()=>statusEl.style.opacity='0',700);
}

function resetGame(){
  elapsed=0;timeLeft=300;score=0;money=0;lives=3;shots=[];
  player.x=W*0.28;player.y=groundY()-player.h;player.vx=0;player.vy=0;
  player.onGround=true;player.facing=1;player.cooldown=0;player.inv=0;
  enemies=[{x:W*0.68,y:groundY()-60,w:56,h:60,hp:2,dir:-1}];
  syncHUD();
}

function startGame(){
  resetGame();
  overlay.style.display='none';
  running=true;
}

function endGame(msg){
  running=false;
  overlay.style.display='flex';
  overlay.querySelector('h1').textContent=msg;
  overlay.querySelector('p').textContent='SCORE: '+Math.floor(score);
  playBtn.textContent='JUGAR DE NUEVO';
}

function jump(){
  if(running && player.onGround){
    player.vy=-690;
    player.onGround=false;
  }
}

function fire(){
  if(!running || player.cooldown>0) return;
  player.cooldown=.22;
  shots.push({
    x:player.x+(player.facing>0?player.w:-18),
    y:player.y+30,w:18,h:10,vx:700*player.facing,life:1.4
  });
}

function bindHold(btn,key){
  const on=(e)=>{e.preventDefault();keys[key]=true; try{btn.setPointerCapture?.(e.pointerId)}catch(_e){}};
  const off=(e)=>{e.preventDefault();keys[key]=false};
  btn.addEventListener('pointerdown',on);
  btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);
  btn.addEventListener('lostpointercapture',off);
  btn.addEventListener('touchstart',(e)=>{e.preventDefault();keys[key]=true},{passive:false});
  btn.addEventListener('touchend',(e)=>{e.preventDefault();keys[key]=false},{passive:false});
}

bindHold(leftBtn,'left');
bindHold(rightBtn,'right');

jumpBtn.addEventListener('pointerdown',(e)=>{e.preventDefault();jump()});
fireBtn.addEventListener('pointerdown',(e)=>{e.preventDefault();fire()});
jumpBtn.addEventListener('touchstart',(e)=>{e.preventDefault();jump()},{passive:false});
fireBtn.addEventListener('touchstart',(e)=>{e.preventDefault();fire()},{passive:false});

window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();
  if(e.key==='f'||e.key==='Shift')fire();
});
window.addEventListener('keyup',(e)=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
});

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function update(dt){
  elapsed+=dt;
  player.cooldown=Math.max(0,player.cooldown-dt);
  player.inv=Math.max(0,player.inv-dt);

  const accel=1700;
  if(keys.left){player.vx-=accel*dt;player.facing=-1}
  if(keys.right){player.vx+=accel*dt;player.facing=1}

  player.vx*=Math.pow(0.0015,dt);
  player.vx=Math.max(-340,Math.min(340,player.vx));
  player.x+=player.vx*dt;
  player.x=Math.max(6,Math.min(W-player.w-6,player.x));

  player.vy+=1700*dt;
  player.y+=player.vy*dt;
  if(player.y>=groundY()-player.h){
    player.y=groundY()-player.h;
    player.vy=0;
    player.onGround=true;
  }

  for(const e of enemies){
    e.x+=e.dir*80*dt;
    if(e.x<20||e.x>W-e.w-20)e.dir*=-1;
    if(hit(player,e)&&player.inv<=0){
      lives--;
      player.inv=1.2;
      showStatus('¡CUIDADO!');
      if(lives<=0){endGame('GAME OVER');return}
    }
  }

  for(const s of shots){s.x+=s.vx*dt;s.life-=dt}

  for(let i=shots.length-1;i>=0;i--){
    let used=false;
    for(const e of enemies){
      if(e.hp>0 && hit(shots[i],e)){
        e.hp--;
        score+=200;
        used=true;
        break;
      }
    }
    if(used)shots.splice(i,1);
  }

  enemies=enemies.filter(e=>e.hp>0);
  if(enemies.length===0){
    enemies.push({x:W-85,y:groundY()-60,w:56,h:60,hp:2,dir:-1});
    money+=25;
    showStatus('+ RD$25');
  }

  shots=shots.filter(s=>s.life>0 && s.x>-40 && s.x<W+40);

  timeLeft-=dt;
  score+=dt*10;
  if(timeLeft<=0){endGame('SE FUE LA LUZ');return}
  syncHUD();
}

function drawBackground(){
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,W,H);

  if(bg.complete && bg.naturalWidth){
    const srcRatio=bg.naturalWidth/bg.naturalHeight;
    const dstRatio=W/H;
    let sx=0,sy=0,sw=bg.naturalWidth,sh=bg.naturalHeight;

    // cover: llena toda la pantalla sin dejar negro
    if(dstRatio>srcRatio){
      sh=bg.naturalWidth/dstRatio;
      sy=(bg.naturalHeight-sh)/2;
    } else {
      sw=bg.naturalHeight*dstRatio;
      sx=(bg.naturalWidth-sw)/2;
    }

    ctx.drawImage(bg,sx,sy,sw,sh,0,0,W,H);
  }
}

function drawPlayer(){
  const x=player.x,y=player.y;
  const phase=Math.sin(elapsed*14)*(Math.abs(player.vx)>25?1:0);

  ctx.save();
  if(player.inv>0 && Math.floor(player.inv*12)%2===0)ctx.globalAlpha=.35;
  ctx.translate(x+player.w/2,y);
  ctx.scale(player.facing,1);

  ctx.fillStyle='#0006';
  ctx.beginPath();ctx.ellipse(0,player.h+4,26,7,0,0,Math.PI*2);ctx.fill();

  // piernas
  ctx.strokeStyle='#a9684a';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-7,48);ctx.lineTo(-12-phase*7,67);ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,48);ctx.lineTo(12+phase*7,67);ctx.stroke();

  // chancletas
  ctx.strokeStyle='#4a3027';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-18-phase*7,69);ctx.lineTo(-5-phase*7,69);ctx.stroke();
  ctx.beginPath();ctx.moveTo(5+phase*7,69);ctx.lineTo(18+phase*7,69);ctx.stroke();

  // shorts
  ctx.fillStyle='#2e5f88';ctx.fillRect(-15,38,30,16);

  // camisilla
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-15,16,30,28,7);ctx.fill();

  // brazos
  ctx.strokeStyle='#b97755';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-12,22);ctx.lineTo(-21+phase*6,41);ctx.stroke();
  ctx.beginPath();ctx.moveTo(12,22);ctx.lineTo(21-phase*6,39);ctx.stroke();

  // cabeza
  ctx.fillStyle='#b97b5c';ctx.beginPath();ctx.arc(0,7,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#231914';ctx.fillRect(-11,1,5,11);

  // gorra verde
  ctx.fillStyle='#2d733d';ctx.fillRect(-13,-8,26,8);ctx.fillRect(8,-4,12,4);

  ctx.restore();
}

function drawEnemy(e){
  ctx.fillStyle='#75b842';
  ctx.beginPath();
  ctx.moveTo(e.x+28,e.y);
  ctx.quadraticCurveTo(e.x+58,e.y+36,e.x+42,e.y+56);
  ctx.quadraticCurveTo(e.x+28,e.y+68,e.x+10,e.y+56);
  ctx.quadraticCurveTo(e.x-4,e.y+36,e.x+28,e.y);
  ctx.fill();

  ctx.fillStyle='#75462c';
  ctx.beginPath();ctx.arc(e.x+28,e.y+38,12,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#fff';
  ctx.fillRect(e.x+14,e.y+20,9,9);
  ctx.fillRect(e.x+33,e.y+20,9,9);

  ctx.fillStyle='#111';
  ctx.fillRect(e.x+18,e.y+22,3,5);
  ctx.fillRect(e.x+34,e.y+22,3,5);
}

function drawShot(s){
  ctx.fillStyle='#ff4b20';
  ctx.beginPath();ctx.arc(s.x+8,s.y+5,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd84d';
  ctx.beginPath();ctx.arc(s.x+11,s.y+3,3,0,Math.PI*2);ctx.fill();
}

function frame(now){
  const dt=Math.min(.032,(now-last)/1000||0);
  last=now;

  drawBackground();
  if(running)update(dt);
  enemies.forEach(drawEnemy);
  shots.forEach(drawShot);
  drawPlayer();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

playBtn.addEventListener('click',startGame);
playBtn.addEventListener('pointerup',(e)=>{e.preventDefault();startGame()});
})();
</script>
